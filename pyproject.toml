[project]
name = "ensp-mcp"
version = "1.0.0"
description = "MCP server and CLI for Huawei eNSP: topology authoring, lab management and real VRP console access"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.3.0"]

[project.scripts]
ensp-mcp = "ensp_mcp.server:main"
enspctl = "ensp_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensp_mcp"]
