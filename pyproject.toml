[project]
name = "ensp-mcp"
version = "0.1.0"
description = "MCP server for Huawei eNSP: topology authoring plus device console access over the VirtualBox virtual screen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.3.0"]

[project.scripts]
ensp-mcp = "ensp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensp_mcp"]
