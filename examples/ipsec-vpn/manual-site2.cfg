# 手工模式（实验步骤①）—— site2 侧，SPI 与 site1 交叉配对
system-view
interface GigabitEthernet0/0/1
 undo ipsec policy
quit

# 与 site1 对称：源 10.1.1.0/24 → 目的 172.16.1.0/24
acl number 3000
 rule 5 permit ip source 10.1.1.0 0.0.0.255 destination 172.16.1.0 0.0.0.255
quit

ipsec proposal ESP1
 esp encryption-algorithm aes-128
 esp authentication-algorithm sha1
quit

ipsec policy MAN1 10 manual
 security acl 3000
 proposal ESP1
 tunnel local 202.100.1.1
 tunnel remote 61.128.1.1
 sa spi outbound esp 512
 sa spi inbound esp 256
 sa encryption-hex outbound esp simple 00112233445566778899aabbccddeeff
 sa authentication-hex outbound esp simple 00112233445566778899aabbccddeeff00112233
 sa encryption-hex inbound esp simple 00112233445566778899aabbccddeeff
 sa authentication-hex inbound esp simple 00112233445566778899aabbccddeeff00112233
quit

interface GigabitEthernet0/0/1
 ipsec policy MAN1
quit
return
