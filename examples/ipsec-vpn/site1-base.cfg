# 实验（训）14 IPsec VPN —— 基础互联配置（三台路由器 + 两台主机）
#
# 拓扑（与《14.IPsecVPN配置.docx》图 14-1 一致）：
#   H1(.1) 172.16.1.1/24 ─ site1(.254) 172.16.1.254/24
#                              site1(.1) 61.128.1.1/24 ─ internet(.10) 61.128.1.10/24
#                                                        internet(.1) 202.100.1.10/24 ─ site2(.1) 202.100.1.1/24
#                                                                                        site2(.254) 10.1.1.254/24 ─ H2(.1) 10.1.1.1/24
#
# 端口对应（AR2220 板型，三个 GE 口）：
#   H1 GE0/0/0 ↔ site1 GE0/0/0
#   site1 GE0/0/1 ↔ internet GE0/0/1
#   internet GE0/0/2 ↔ site2 GE0/0/2
#   site2 GE0/0/0 ↔ H2 GE0/0/0

system-view
interface GigabitEthernet0/0/0
 ip address 172.16.1.254 255.255.255.0
quit
interface GigabitEthernet0/0/1
 ip address 61.128.1.1 255.255.255.0
quit
ip route-static 0.0.0.0 0.0.0.0 61.128.1.10
ip route-static 10.1.1.0 255.255.255.0 61.128.1.10
return
