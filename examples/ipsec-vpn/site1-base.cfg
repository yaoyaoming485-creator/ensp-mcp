# site1 的接口地址与路由
# 私网 10.1.1.0/24 的下一跳是**隧道对端** 202.100.1.1，不是 internet 路由器：
# 指向对端公网地址，匹配 ACL 的报文才会走隧道；指向 internet 的话，明文私网
# 地址会被送到公网上，而公网路由器按设计没有私网路由（这正是实验要求的
# “在 internet 上看不到私有网段的信息”）。
system-view
interface GigabitEthernet0/0/0
 ip address 172.16.1.254 255.255.255.0
quit
interface GigabitEthernet0/0/1
 ip address 61.128.1.1 255.255.255.0
quit
ip route-static 0.0.0.0 0.0.0.0 61.128.1.10
ip route-static 10.1.1.0 255.255.255.0 202.100.1.1
return
