# 实验（训）14 IPsec VPN —— IKE 自主协商模式（site1）
#
# 前提：site1-base.cfg 已经配好接口地址与路由。
# 隧道保护 172.16.1.0/24 <-> 10.1.1.0/24，公网侧地址 61.128.1.1 <-> 202.100.1.1。

system-view

# 先在接口上解绑、再删掉策略：策略还在用时改对端会报 "IKE Peer in use."
interface GigabitEthernet0/0/1
 undo ipsec policy
quit
undo ipsec policy IPSEC1

# ---- 感兴趣流：两个私有网段互访的报文才进隧道 ----
acl number 3000
 rule 5 permit ip source 172.16.1.0 0.0.0.0 destination 10.1.1.0 0.0.0.0
quit

# ---- IPsec 安全提议（ESP 封装方式） ----
ipsec proposal ESP1
 esp encryption-algorithm aes-128
 esp authentication-algorithm sha1
quit

# ---- IKE 提议（协商参数，两端必须一致） ----
ike proposal 5
 encryption-algorithm aes-cbc-128
 dh group1
 authentication-algorithm sha1
 authentication-method pre-share
quit

# ---- 对端（site2）：预共享密钥 + 两端的公网地址 ----
ike peer SITE2 v1
 pre-shared-key cipher Huawei@123
 ike-proposal 5
 local-address 61.128.1.1
 remote-address 202.100.1.1
quit

# ---- IPsec 安全策略：绑定 ACL、对端、提议 ----
ipsec policy IPSEC1 10 isakmp
 security acl 3000
 ike-peer SITE2
 proposal ESP1
quit

# ---- 绑到公网口 ----
interface GigabitEthernet0/0/1
 ipsec policy IPSEC1
quit

return
