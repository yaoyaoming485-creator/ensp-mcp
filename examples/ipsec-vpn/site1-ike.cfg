# IKE 自主协商模式（实验步骤②）—— site1 侧
# 顺序不能乱：策略一旦引用了对端，再改对端会报 "IKE Peer in use."，
# 所以要先在接口上解绑、再删策略、改完对端再重建并重新绑定。
system-view
interface GigabitEthernet0/0/1
 undo ipsec policy
quit
undo ipsec policy IPSEC1

acl number 3000
 rule 5 permit ip source 172.16.1.0 0.0.0.255 destination 10.1.1.0 0.0.0.255
quit

ipsec proposal ESP1
 esp encryption-algorithm aes-128
 esp authentication-algorithm sha1
quit

ike proposal 5
 encryption-algorithm aes-cbc-128
 dh group1
 authentication-algorithm sha1
 authentication-method pre-share
quit

ike peer SITE2 v1
 pre-shared-key cipher Huawei@123
 ike-proposal 5
 local-address 61.128.1.1
 remote-address 202.100.1.1
quit

ipsec policy IPSEC1 10 isakmp
 security acl 3000
 ike-peer SITE2
 proposal ESP1
quit

interface GigabitEthernet0/0/1
 ipsec policy IPSEC1
quit
return
