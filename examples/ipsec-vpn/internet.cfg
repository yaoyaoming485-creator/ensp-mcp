# 实验（训）14 IPsec VPN —— internet 路由器（公网）
#
# 只配两个直连网段，**不给私有网段配路由**：
# IPsec 之后 internet 上只会看到 ESP 报文，看不到 172.16.1.0 / 10.1.1.0 的明文。

system-view
interface GigabitEthernet0/0/1
 ip address 61.128.1.10 255.255.255.0
quit
interface GigabitEthernet0/0/0
 ip address 202.100.1.10 255.255.255.0
quit
return
