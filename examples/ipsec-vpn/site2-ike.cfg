# 实验（训）14 IPsec VPN —— IKE 自主协商模式（site2）
#
# 与 site1-ike.cfg 对称：预共享密钥、IKE 提议、ESP 提议必须完全一致。

system-view

# 先在接口上解绑、再删掉策略：策略还在用时改对端会报 "IKE Peer in use."
interface GigabitEthernet0/0/1
 undo ipsec policy
quit
undo ipsec policy IPSEC1

acl number 3000
 rule 5 permit ip source 10.1.1.0 0.0.0.0 destination 172.16.1.0 0.0.0.0
quit

ipsec proposal ESP1
 esp encryption-algorithm aes-128
 esp authentication-algorithm sha1
quit

ike proposal 5
 encryption-algorithm aes-cbc-128
 dh group1
 authentication-algorithm sha1
 authentication-method pre-share
quit

ike peer SITE2 v1
 pre-shared-key cipher Huawei@123
 ike-proposal 5
 local-address 202.100.1.1
 remote-address 61.128.1.1
quit

ipsec policy IPSEC1 10 isakmp
 security acl 3000
 ike-peer SITE2
 proposal ESP1
quit

interface GigabitEthernet0/0/1
 ipsec policy IPSEC1
quit

return
