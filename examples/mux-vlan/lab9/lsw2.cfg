# 实验（训）9 MUX-VLAN：LSW2（接入侧，普通 VLAN + trunk）
#
# LSW2 不承载 MUX-VLAN 组，只是把各 VLAN 透传给 LSW1：
#   GE0/0/1 上联 LSW1（trunk，放通 10 20 30 100）
#   GE0/0/2 PC5（部门2，VLAN20）
#   GE0/0/3 PC6（部门3，VLAN30）
#   GE0/0/4 Server1（VLAN100，主 VLAN 的成员）
#
# 部门2 的成员 PC2（LSW1 GE0/0/3）与 PC5（本机 GE0/0/2）同在 VLAN20，
# 靠互通型从 VLAN 的语义互通；部门1 的 PC1/PC3 同在 VLAN10，属隔离型从 VLAN，不互通。

system-view

# ---- 建 VLAN ----
vlan 10
quit
vlan 20
quit
vlan 30
quit
vlan 100
quit

# ---- 上联 LSW1 ----
interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
quit

# ---- 部门2：PC5 ----
interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 20
quit

# ---- 部门3：PC6 ----
interface GigabitEthernet0/0/3
 port link-type access
 port default vlan 30
quit

# ---- 服务器：主 VLAN 100 ----
interface GigabitEthernet0/0/4
 port link-type access
 port default vlan 100
quit

return
