# 实验（训）9 MUX-VLAN：LSW1（承载 MUX-VLAN 组的那台）
#
# 拓扑见 lab9.topo.json（与《9.MUX-VLAN的配置.docx》的图 9-1 一致）：
#   LSW1 GE0/0/1 PC1 | GE0/0/2 PC3 | GE0/0/3 PC2 | GE0/0/4 PC4 | GE0/0/5 上联 LSW2
#   LSW2 GE0/0/1 上联 LSW1 | GE0/0/2 PC5 | GE0/0/3 PC6 | GE0/0/4 Server1
#
# MUX-VLAN 组：主 VLAN 100（服务器所在段）+ 隔离型从 VLAN 10（部门1）
#               + 互通型从 VLAN 20（部门2）、30（部门3）
#
# 三条语法规则见 ../mux-vlan-sw1.cfg 的头部注释（同样适用）。

system-view

# ---- 从 VLAN：先创建 ----
vlan 10
quit
vlan 20
quit
vlan 30
quit

# ---- 主 VLAN：单独提交一次 ----
vlan 100
 mux-vlan
quit

# ---- 挂从 VLAN（在主 VLAN 视图下，参数是从 VLAN 的 ID）----
vlan 100
 subordinate separate 10
 subordinate group 20
 subordinate group 30
quit

# ---- 部门1（VLAN10，隔离型）：两个成员之间不通 ----
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 10
 port mux-vlan enable
quit
interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 10
 port mux-vlan enable
quit

# ---- 部门2（VLAN20，互通型）----
interface GigabitEthernet0/0/3
 port link-type access
 port default vlan 20
 port mux-vlan enable
quit

# ---- 部门3（VLAN30，互通型）----
interface GigabitEthernet0/0/4
 port link-type access
 port default vlan 30
 port mux-vlan enable
quit

# ---- 上联 LSW2：trunk 放通四个 VLAN ----
#     注意：trunk 口不能使能 port mux-vlan enable
#     （Error: Only one VLAN can be configured on the port.）
interface GigabitEthernet0/0/5
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
quit

# ---- 网关（本平台的 S5700 拒绝在 MUX VLAN 上建三层接口，见 README.md）----
# interface Vlanif100
#  ip address 192.168.1.1 255.255.255.0
# quit

return
