# 实验（训）9 MUX-VLAN 的配置
#
# 需求（来自《9.MUX-VLAN的配置.docx》）：
#   公司内部三个部门：部门1 在 VLAN10、部门2 在 VLAN20、部门3 在 VLAN30，
#   服务器在 VLAN100。三个部门之间不可以互通，但都可以跟服务器 Server 互通；
#   部门1 内部也隔离，部门2、部门3 内部可以互通。
#
# MUX-VLAN 映射（依据华为官方命令参考，见 README.md 的出处）：
#   VLAN100 -> 主 VLAN (principal)      -> 交换机上挂 Server
#   VLAN10  -> 隔离型从 VLAN (separate)  -> 部门1：同 VLAN 内成员之间也不通
#   VLAN20  -> 互通型从 VLAN (group)     -> 部门2：同 VLAN 内成员之间通
#   VLAN30  -> 互通型从 VLAN (group)     -> 部门3：同 VLAN 内成员之间通
#
# 关键约束（华为官方）：主 VLAN 与所有从 VLAN 互通；不同从 VLAN 之间一律
# 不互通；一个主 VLAN 下只能有一个隔离型从 VLAN；只有主 VLAN 能配 VLANIF。
#
# ---------------------------------------------------------------------------
# 实机验证过的三条语法规则（eNSP 自带 S5700 / VRP 5.110 / S5700 V200R001C00）
#   1) subordinate 必须【在主 VLAN 的视图】下执行，参数填【从 VLAN 的 ID】：
#        vlan 100 -> subordinate separate 10 / subordinate group 20
#      在从 VLAN 的视图里执行会报
#        Error: Must configure principal vlan firstly.
#      （这句极具误导性，真意是"当前视图不是主 VLAN"）
#   2) 从 VLAN 必须先创建（vlan 10 / 20 / 30），否则 subordinate 报
#        Error: Vlan is not exist.
#   3) 主 VLAN 的 mux-vlan 要单独提交一次（vlan 100 -> mux-vlan -> quit，
#      再重新进入 vlan 100），同一批粘贴里紧跟着写 subordinate 会报
#        Error: Please enable MUX-VLAN in vlan command mode.
#   4) 本版本的 port mux-vlan enable 【不带 vlan 参数】：
#        port mux-vlan enable
#      写 "port mux-vlan enable vlan 10" 会被拒。
#   5) 本版本主 VLAN 不能配三层接口（见 README.md「本平台的硬限制」），
#      所以网关那一段默认是注释掉的。
#
# 本文件下发到交换机（SW1）：
#
system-view

# ---- 建从 VLAN：先创建，否则 subordinate 报 "Vlan is not exist." ----
vlan 10
quit
vlan 20
quit
vlan 30
quit

# ---- 主 VLAN：服务器所在段；单独提交一次 ----
vlan 100
 mux-vlan
quit

# ---- 从 VLAN：隔离型（部门1）与互通型（部门2、部门3）----
vlan 100
 subordinate separate 10
 subordinate group 20
 subordinate group 30
quit

# ---- 网关：只有主 VLAN 能配 VLANIF ----
#   本平台的 S5700（VRP 5.110）拒绝在 MUX VLAN 上建三层接口：
#     interface Vlanif100
#       Error: The VLAN is already a MUX VLAN.
#   顺序反过来（先建三层接口再配 mux-vlan）也不行：
#     Error: The VLAN has a L3 interface, Please delete it first.
#   因此下面两行在本平台会被拒；在支持 MUX-VLAN 共享网关的新版 VRP
#   （S5700 V200R011 及以后 / S9300 等）上，打开它们即可实现
#   "各部门的终端都能访问主 VLAN 里的服务器"。
#
# interface Vlanif100
#  ip address 192.168.100.1 255.255.255.0
# quit

# 接口名按 eNSP 的 S5700 编号（1 起）：GigabitEthernet0/0/1 .. 0/0/24

# ---- 部门1：隔离型从 VLAN，两个成员之间不通 ----
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 10
 port mux-vlan enable
quit
interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 10
 port mux-vlan enable
quit

# ---- 部门2：互通型从 VLAN，成员之间通 ----
interface GigabitEthernet0/0/3
 port link-type access
 port default vlan 20
 port mux-vlan enable
quit
interface GigabitEthernet0/0/4
 port link-type access
 port default vlan 20
 port mux-vlan enable
quit

# ---- 部门3：互通型从 VLAN，成员之间通 ----
interface GigabitEthernet0/0/5
 port link-type access
 port default vlan 30
 port mux-vlan enable
quit
interface GigabitEthernet0/0/6
 port link-type access
 port default vlan 30
 port mux-vlan enable
quit

# ---- 服务器：主 VLAN ----
interface GigabitEthernet0/0/7
 port link-type access
 port default vlan 100
 port mux-vlan enable
quit

return
